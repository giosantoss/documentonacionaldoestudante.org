<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Atualização até março de 2027</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="hero">

    <!-- Elementos decorativos de fundo -->
    <div class="background-lines background-lines--top"></div>
    <div class="background-lines background-lines--bottom"></div>

    <!-- Linha superior -->
    <header class="header">
      <div class="logo logo--one">
        <img src="assets/dne.svg" alt="">
      </div>

      <div class="logo logo--year">
        <img src="assets/orgs.svg" alt="">
      </div>
    </header>

    <!-- Curva principal -->
    <div class="visual">
      <svg
        class="visual__line"
        viewBox="0 0 1000 1200"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <defs>
          <linearGradient
            id="mainGradient"
            x1="0%"
            y1="0%"
            x2="30%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#1f67d6" />
            <stop offset="47%" stop-color="#315fc7" />
            <stop offset="72%" stop-color="#8459b5" />
            <stop offset="100%" stop-color="#db4c91" />
          </linearGradient>
        </defs>

        <path
          d="
            M -90 220
            C 140 310, 300 180, 540 95
            C 790 5, 1025 80, 1010 350
            C 995 620, 865 870, 650 1040
            C 470 1185, 205 1190, 150 1035
            C 105 905, 235 825, 350 875
            C 470 925, 475 1085, 385 1160
          "
          fill="none"
          stroke="url(#mainGradient)"
          stroke-width="52"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="loading-screen" id="loading-screen">
        <img src="assets/dne 2.svg" alt="">

        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Autenticando documento...</p>
        </div>

        <img src="assets/2026.svg" alt="">
    </div>

    <!-- Conteúdo central -->
    <section class="content" id="main-content">

      <div class="pagination" aria-hidden="true">
        <img src="assets/ID.svg" alt="">
      </div>

      <h1 class="title">
        <span>Documento válido até</span>
        <strong>Março de 2027</strong>
      </h1>

      <div class="progress-container">


  <div
    class="progress-bar"
    role="progressbar"
    aria-label="Progresso até março de 2027"
    aria-valuemin="0"
    aria-valuemax="12"
    aria-valuenow="0"
  >
    <div class="progress-segments" id="progress-segments">
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
      <span class="progress-segment"></span>
    </div>
  </div>

  <div class="progress-months" aria-hidden="true">
    <span>ABR</span>
    <span>MAI</span>
    <span>JUN</span>
    <span>JUL</span>
    <span>AGO</span>
    <span>SET</span>
    <span>OUT</span>
    <span>NOV</span>
    <span>DEZ</span>
    <span>JAN</span>
    <span>FEV</span>
    <span>MAR</span>
  </div>

  <p class="progress-description" id="progress-description">
    Calculando a validade...
  </p>
</div>
    </section>



  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const loadingScreen = document.getElementById(
      "loading-screen"
    );

    const mainContent = document.getElementById(
      "main-content"
    );

    const startYear = 2026;
    const startMonth = 3;
    const totalMonths = 12;

    const today = new Date();

    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();

    const elapsedMonths =
      (currentYear - startYear) * 12 +
      (currentMonth - startMonth) +
      1;

    const completedMonths = Math.max(
      0,
      Math.min(totalMonths, elapsedMonths)
    );

    const percentage =
      (completedMonths / totalMonths) * 100;

    const segments = document.querySelectorAll(
      ".progress-segment"
    );

    const progressBar = document.querySelector(
      ".progress-bar"
    );

    const progressSegments = document.getElementById(
      "progress-segments"
    );

    const descriptionElement = document.getElementById(
      "progress-description"
    );

    segments.forEach((segment, index) => {
      if (index < completedMonths) {
        segment.classList.add("is-filled");
      }

      if (
        index === completedMonths - 1 &&
        completedMonths < totalMonths
      ) {
        segment.classList.add("is-current");
      }
    });

progressSegments.style.setProperty(
  "--progress-width",
  `${percentage}%`
);

window.setTimeout(() => {
  mainContent.classList.add("is-visible");
  loadingScreen.classList.add("is-hidden");

  window.setTimeout(() => {
    progressSegments.classList.add("is-animated");
  }, 250);
}, 2200);

    

    progressBar.setAttribute(
      "aria-valuenow",
      completedMonths
    );

    if (completedMonths === 0) {
      descriptionElement.textContent =
        "O preenchimento começará em abril de 2026.";
    } else if (completedMonths >= totalMonths) {
      descriptionElement.textContent =
        "Atualização concluída em março de 2027.";
    } else {
      const remainingMonths =
        totalMonths - completedMonths;

      descriptionElement.textContent =
        `${remainingMonths} meses restantes`;
    }

    /*
      Pequeno tempo mínimo para a tela de carregamento
      aparecer de forma perceptível.
    */
    window.setTimeout(() => {
      mainContent.classList.add("is-visible");
      loadingScreen.classList.add("is-hidden");
    }, 2000);
  });
</script>
</body>
</html>
